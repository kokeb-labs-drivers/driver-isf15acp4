<text x="136" y="184.6" font-size="13" font-weight="700" fill="#E2E8F0">ISF15ACP4</text>
<text x="222.2" y="184.6" font-size="12" fill="#E2E8F0">Module</text>
<text x="180" y="250.3" font-size="15" font-weight="700" fill="#BFDBFE">MCU interface</text>
<text x="180" y="275.1" font-size="13" fill="#D2DAE4">serial, write only</text>
<text x="532" y="250.3" font-size="15" font-weight="700" fill="#F8D27A">Command decoder</text>
<text x="532" y="275.1" font-size="13" fill="#D2DAE4">Table 10</text>
<text x="884" y="250.3" font-size="15" font-weight="700" fill="#A7F3E6">Display RAM</text>
<text x="884" y="275.1" font-size="13" fill="#D2DAE4">96 x 64 x 16 bit</text>
<text x="180" y="402.3" font-size="15" font-weight="700" fill="#E2E8F0">Reset and power</text>
<text x="180" y="427.2" font-size="13" fill="#D2DAE4">RES#, VDD, VCC, GND</text>
<text x="532" y="402.3" font-size="15" font-weight="700" fill="#F8D27A">Oscillator and timing</text>
<text x="532" y="427.2" font-size="13" fill="#D2DAE4">display clock</text>
<text x="884" y="402.3" font-size="15" font-weight="700" fill="#F8D27A">Gray scale decoder</text>
<text x="884" y="427.2" font-size="13" fill="#D2DAE4">65k colours</text>
<text x="180" y="554.3" font-size="15" font-weight="700" fill="#FDE68A">SPST switch</text>
<text x="180" y="579.2" font-size="13" fill="#D2DAE4">normally open</text>
<text x="532" y="554.3" font-size="15" font-weight="700" fill="#F8D27A">SEG/COM driving block</text>
<text x="532" y="579.2" font-size="13" fill="#D2DAE4">96 RGB x 64</text>
<text x="884" y="554.3" font-size="15" font-weight="700" fill="#A7F3E6">Colour OLED panel</text>
<text x="884" y="579.2" font-size="13" fill="#D2DAE4">passive matrix</text>
