# The vendor documents this driver was written against (handbook ADR-0019), and where the driver relies on them.
# Never commit a PDF: `sha256` identifies the exact file that was used, so a reader can confirm they hold the same
# revision.
#
# The module's sheet (`ds`) does not print a document number or a revision, only the page footer E4 to E9 and the date
# 10/03/19, and it does not name the display controller. The controller's own datasheet (`ctl`) is the SSD1331 of
# Solomon Systech, Rev 1.2 of November 2007. The copy this driver was written against came from the Adafruit mirror:
# the manufacturer's page lists the part but links no PDF, and the mirror file's hash is recorded here. That the
# module's controller is an SSD1331 is not stated in the NKK sheet; NKK's application notes (`notes`) state it ("All OLED
# modules incorporate the same OLED controller (SSD1331)"). The application notes and the engineering-kit manual are
# web pages (docs.nkkswitches.com), not PDFs: `sha256` is the hash of the HTML file as saved on the `retrieved` date, the vendor
# does not print a revision or a date on them, and the page may change, so a reader who needs the same text compares
# hashes. The charge-pump manual is a PDF that NKK links from those pages; the exact URL of the copy used was not
# recorded, so its `url` is the application notes page that describes the pumps.
#
# The README card, docs/datasheet.md and the "Datasheet" box on each page are generated from this file by
# tools/docs/generators/datasheet.py (`kokeb-docs gen`). Section names and printed page numbers are the documents' own;
# for the NKK sheet `page` counts the six pages of the PDF (E4 is page 1).
documents:
  - id: ds
    vendor: NKK Switches
