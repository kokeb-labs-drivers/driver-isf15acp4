    doc: ds
    section: Recommended operating conditions (sheets E5, E7)
    page: 2
    driver: "`EnsureInitialized()`, `DisplayOn()`, `DisplayOff()`, `Deinitialize()`, `IsSupplyEnabled()`"
    docs: [hardware, contract, architecture]
  - topic: Switch circuit and contact data
    doc: ds
    section: Switch specifications (sheet E5)
    page: 2
    driver: "`ButtonConfig`, `ButtonDebouncer`, `Poll()`"
    docs: [api-guide, configuration, ambiguities]
