<text x="48" y="331.4" font-size="17" font-weight="700" fill="#7A360E">HARDWARE-AGNOSTIC CORE</text>
<text x="48" y="354.6" font-size="16" fill="#7A360E">ISF15ACP4, inc/isf15acp4.hpp</text>
<rect x="405.4" y="258.4" width="49.1" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="276.2" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">calls</text>
<text x="56" y="819.6" font-size="20" font-weight="700" fill="#7A360E">Port contract</text>
<text x="56" y="850.2" font-size="17" fill="#2B3442">SpiInterface&lt;YourPort&gt;: checked at compile time, no virtual calls</text>
<text x="56" y="972.6" font-size="20" font-weight="700" fill="#0B5F59">Your port</text>
<text x="56" y="1001.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">GpioSet()  EnsureInitialized()  Write()</text>
<text x="56" y="1124.6" font-size="20" font-weight="700" fill="#334155">ISF15ACP4</text>
<text x="56" y="1155.2" font-size="17" fill="#2B3442">the chip, on the SPI bus</text>
<rect x="322.9" y="740.6" width="214.1" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="758.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">register reads and writes</text>
<rect x="329.6" y="893.6" width="200.8" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="911.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">forwards to your hooks</text>
<rect x="371.8" y="1045.6" width="116.4" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="1063.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">SPI transfers</text>
<text x="886" y="337.4" font-size="20" font-weight="700" fill="#7A360E">Shared</text>
<text x="886" y="360.8" font-size="17" fill="#7A360E">The core and the contract are</text>
<text x="886" y="385.5" font-size="17" fill="#7A360E">the same code on every MCU</text>
<text x="886" y="410.1" font-size="17" fill="#7A360E">and on the host.</text>
<text x="886" y="972.6" font-size="20" font-weight="700" fill="#0B5F59">Yours</text>
<text x="886" y="996.1" font-size="17" fill="#0B5F59">One small class per MCU or</text>
<text x="886" y="1020.7" font-size="17" fill="#0B5F59">board.</text>
