---
kind: timing
id: spi-timing
title: SPI write timing
kicker: On the bus
alt: >-
  SPI write timing of the ISF15ACP4's SSD1331 controller in mode 0: CS# low frames one byte, D/C# selects command or
  data, and SDIN is read on each rising SCLK edge, most significant bit first, with the times of Table 21.
reads: >-
  The four lanes are CS#, D/C#, SCLK and SDIN, left to right in time. CS# goes low, D/C# is low for a command byte or
  high for a data byte, SCLK idles low and the controller shifts SDIN in on each rising edge from D7 to D0; bits D4
  and D3 are left out. The table gives each interval with its Table 21 value and the module's supply range.
bus: spi
mode: {cpol: 0, cpha: 0}
refs:
  spi: {doc: ctl, section: "7.1.3 Serial Interface", page: 17}
  timing: {doc: ctl, section: "12 AC Characteristics, Table 21", page: 57}
  supply: {doc: ds, section: "Recommended operating conditions (sheets E5, E7)", page: 2}
  sck: {doc: notes, section: "Design Considerations 2 and 5", page: 1}
signals:
  - {id: cs, label: CS#, wave: "10.........1."}
  - {id: dc, label: D/C#, wave: "x=.........x.", data: ["low: command, high: data"], tone: teal}
  - {id: sclk, label: SCLK, wave: "0..nnn|nnn0..", clock: true}
  - {id: sdin, label: SDIN, wave: "x..===|===x..", data: [D7, D6, D5, D2, D1, D0]}
groups:
  - {from: 3, to: 10, label: "8 bits, MSB first", ref: spi}
