  - {id: tas, symbol: tAS, label: "Address (D/C#) setup time", min: 40, unit: ns, ref: timing}
  - {id: tah, symbol: tAH, label: "Address (D/C#) hold time", min: 40, unit: ns, ref: timing}
  - {id: tcycle, symbol: tcycle, label: Clock cycle time, min: 150, unit: ns, ref: timing}
  - {id: tclkl, symbol: tCLKL, label: Clock low time, min: 75, unit: ns, ref: timing}
  - {id: tclkh, symbol: tCLKH, label: Clock high time, min: 75, unit: ns, ref: timing}
  - {id: tdsw, symbol: tDSW, label: Write data setup time, min: 40, unit: ns, ref: timing}
  - {id: tdhw, symbol: tDHW, label: Write data hold time, min: 40, unit: ns, ref: timing}
  - {id: trf, symbol: tR/tF, label: Rise and fall time, max: 15, unit: ns, ref: timing}
