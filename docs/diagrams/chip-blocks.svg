<text x="136" y="184.6" font-size="13" font-weight="700" fill="#334155">ISF15ACP4</text>
<text x="222.2" y="184.6" font-size="12" fill="#334155">Module</text>
<text x="180" y="250.3" font-size="15" font-weight="700" fill="#1E429F">MCU interface</text>
<text x="180" y="275.1" font-size="13" fill="#2B3442">serial, write only</text>
<text x="532" y="250.3" font-size="15" font-weight="700" fill="#7A360E">Command decoder</text>
<text x="532" y="275.1" font-size="13" fill="#2B3442">Table 10</text>
<text x="884" y="250.3" font-size="15" font-weight="700" fill="#0B5F59">Display RAM</text>
<text x="884" y="275.1" font-size="13" fill="#2B3442">96 x 64 x 16 bit</text>
<text x="180" y="402.3" font-size="15" font-weight="700" fill="#334155">Reset and power</text>
<text x="180" y="427.2" font-size="13" fill="#2B3442">RES#, VDD, VCC, GND</text>
<text x="532" y="402.3" font-size="15" font-weight="700" fill="#7A360E">Oscillator and timing</text>
<text x="532" y="427.2" font-size="13" fill="#2B3442">display clock</text>
<text x="884" y="402.3" font-size="15" font-weight="700" fill="#7A360E">Gray scale decoder</text>
<text x="884" y="427.2" font-size="13" fill="#2B3442">65k colours</text>
<text x="180" y="554.3" font-size="15" font-weight="700" fill="#8A3C0B">SPST switch</text>
<text x="180" y="579.2" font-size="13" fill="#2B3442">normally open</text>
<text x="532" y="554.3" font-size="15" font-weight="700" fill="#7A360E">SEG/COM driving block</text>
<text x="532" y="579.2" font-size="13" fill="#2B3442">96 RGB x 64</text>
<text x="884" y="554.3" font-size="15" font-weight="700" fill="#0B5F59">Colour OLED panel</text>
<text x="884" y="579.2" font-size="13" fill="#2B3442">passive matrix</text>
