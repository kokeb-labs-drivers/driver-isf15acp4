<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1036" viewBox="0 0 1200 1036" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the ISF15ACP4 does</title>
<desc id="chip-capabilities-desc">Capability map of the ISF15ACP4: Colour display (supported): Writes windows, single pixels and whole frames in 65,536 or 256 colours on the 96 x 64 panel; Drawing engine (supported): Draws lines and rectangles, copies, dims and clears a window with the controller's own engine; Scrolling (supported): Scrolls a window of the display horizontally and vertically at a set speed; Contrast and current (supported): Sets the contrast of each colour, the master current and a dim mode; Power sequence (supported): Resets and configures the controller with the 15 V supply off, then enables it and turns the panel on; Sleep (supported): Puts the display to sleep, 10 µA at most on each supply, and wakes it on the next press; Controller settings (supported): Remap, start line, clock, phase periods, gray scale table, pre-charge and VCOMH of the controller; SPST switch (supported): Debounces the contact and reports press, release, long press and repeat events; Smaller modules (supported): Presets for the ISC15ANP4 (64 x 48, with switch) and ISC01P (52 x 36, display only).</desc>
