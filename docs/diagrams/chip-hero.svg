<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="747" viewBox="0 0 1200 747" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">ISF15ACP4</title>
<desc id="chip-hero-desc">Overview of the ISF15ACP4, a pushbutton with a 96 RGB x 64 colour OLED in its cap and a normally open switch under it: the display takes commands and pixels over a write-only SPI bus, the switch is a plain contact on two pins. A MCU talks to it over SPI, write only; it drives Colour OLED; it reads back Switch. Headline figures: 96 RGB x 64 pixels in the cap; 65,536 colours in 16-bit mode; 1 million actuations at least; 50,000 h display life at least.</desc>
