<svg xmlns="http://www.w3.org/2000/svg" width="1144" height="733" viewBox="0 0 1144 733" role="img" aria-labelledby="chip-circuit-typical-title chip-circuit-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-typical-title">ISF15ACP4: Typical application</title>
<desc id="chip-circuit-typical-desc">Schematic of the ISF15ACP4 typical application: the chip with U2 MCU, J1 OLED supply, R1 resistor 10 kΩ, R2 resistor 100 kΩ; the MCU wires carry the port hooks GpioSet(CtrlPin::Reset), GpioSet(CtrlPin::VccEnable), ReadSwitch(), Write(), Write(DataKind).</desc>
<rect x="0.5" y="0.5" width="1143" height="732" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">ISF15ACP4: Typical application</text>
<text x="32" y="103.8" font-size="15" fill="#566070">The module on an MCU's SPI bus (write only), with D/C#, RES# and the enable of the OLED supply on GPIOs the driver drives through Write()</text>
<text x="32" y="125.5" font-size="15" fill="#566070">and GpioSet(), and the switch on an input with a pull-up that ReadSwitch() reads. The supply is VCC 14 V to 16 V on the ISF15ACP4 and 15 V to</text>
<text x="32" y="147.3" font-size="15" fill="#566070">17 V on the ISC15ANP4 and ISC01P (the ISC01P has 8 pins and no switch: see the variants table). The OLED supply is a charge pump whose</text>
<text x="32" y="169.1" font-size="15" fill="#566070">shut-down input is the enable: high is on, low floats the output; the IS-CHPMP has no pull-down on that input, so add one. Above each MCU</text>
<text x="32" y="190.8" font-size="15" fill="#566070">wire: the port hook that drives it. Datasheet: 7.9 Power ON and OFF Sequence, p. 27.</text>
