<svg xmlns="http://www.w3.org/2000/svg" width="783" height="651" viewBox="0 0 783 651" role="img" aria-labelledby="start-up-and-draw-title start-up-and-draw-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="start-up-and-draw-title">From start-up to a drawn rectangle</title>
<desc id="start-up-and-draw-desc">From start-up to a drawn rectangle: initialisation powers and resets the display and clears its memory, DisplayOn raises the panel supply and sends the display-on command, and DrawRectangle sends one drawing command.</desc>
